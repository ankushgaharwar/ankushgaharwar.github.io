<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive App Wall</title>
  <style>
    :root {
      --bg: #edf0f4;
      --panel: #e8ebef;
      --shadow-soft: rgba(146, 156, 168, 0.28);
      --shadow-hard: rgba(98, 108, 120, 0.24);
      --icon-size: clamp(88px, 9vw, 130px);
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --move-x: 0px;
      --move-y: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Inter", "SF Pro Text", "Segoe UI", sans-serif;
      background: linear-gradient(125deg, #dfe5ec 0%, #f6f8fb 42%, #e6e9ee 100%);
      overflow: hidden;
      color: #1d232c;
    }

    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 1200px;
      background:
        radial-gradient(1200px 700px at 15% 80%, rgba(255, 255, 255, 0.78), transparent 68%),
        linear-gradient(140deg, #d7dce3 0%, #f6f8fa 40%, #dde2e9 100%);
      cursor: default;
      isolation: isolate;
    }

    .room {
      position: absolute;
      inset: 7% 13% 10%;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(255, 255, 255, 0.2) 22%, rgba(0, 0, 0, 0.03) 100%),
        linear-gradient(122deg, #e7ecf1 0%, #f8fafd 38%, #e0e6ed 100%);
      box-shadow:
        inset 12px 12px 30px rgba(149, 159, 173, 0.35),
        inset -12px -12px 35px rgba(255, 255, 255, 0.9),
        0 40px 80px rgba(130, 142, 158, 0.24);
      transform-style: preserve-3d;
      transform: translate3d(var(--move-x), var(--move-y), 0) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transition: transform 180ms ease;
    }

    .sun-shafts {
      position: absolute;
      right: 4%;
      top: 0;
      width: 45%;
      height: 100%;
      pointer-events: none;
      background:
        linear-gradient(145deg, transparent 0%, rgba(255, 255, 255, 0.78) 37%, rgba(185, 194, 206, 0.33) 40%, transparent 58%),
        linear-gradient(145deg, transparent 23%, rgba(255, 255, 255, 0.56) 27%, rgba(185, 194, 206, 0.24) 30%, transparent 44%);
      mix-blend-mode: screen;
      opacity: 0.8;
      transform: translateX(calc(var(--move-x) * -0.7));
      transition: transform 200ms ease;
    }

    .apps {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(720px, 72vw);
      display: grid;
      grid-template-columns: repeat(4, var(--icon-size));
      gap: clamp(16px, 2vw, 24px);
      justify-content: center;
      transform: translate(-50%, -50%) translate3d(calc(var(--move-x) * 0.45), calc(var(--move-y) * 0.45), 30px);
      transition: transform 120ms linear;
    }

    .app {
      position: relative;
      width: var(--icon-size);
      height: var(--icon-size);
      border: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      color: #111;
      background: radial-gradient(circle at 35% 30%, #ffffff, #edf0f4);
      box-shadow:
        inset 7px 7px 10px rgba(255, 255, 255, 0.95),
        inset -10px -12px 16px rgba(169, 179, 191, 0.35),
        0 10px 22px rgba(109, 118, 131, 0.25);
      transform: translate3d(calc(var(--depth, 0) * var(--move-x) * 0.25), calc(var(--depth, 0) * var(--move-y) * 0.25), 0)
        scale(1);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      user-select: none;
    }

    .app:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        inset 7px 7px 10px rgba(255, 255, 255, 0.95),
        inset -10px -12px 16px rgba(169, 179, 191, 0.35),
        0 14px 26px rgba(92, 100, 111, 0.3);
      filter: saturate(1.08);
    }

    .app:active {
      transform: translateY(-1px) scale(0.98);
    }

    .app small {
      position: absolute;
      bottom: -28px;
      width: max-content;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: rgba(47, 56, 68, 0.72);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .app:hover small {
      opacity: 1;
      transform: translateY(0);
    }

    .app .glyph {
      font-size: clamp(34px, 3.8vw, 54px);
      line-height: 1;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
    }

    .weather { background: radial-gradient(circle at 30% 28%, #37b5ff, #1687ff 56%, #0f67d7); }
    .chat { background: radial-gradient(circle at 30% 26%, #56ef70, #22c73f 60%, #15a533); }
    .calendar { background: radial-gradient(circle at 30% 26%, #fff, #e9e9e9); }
    .photos { background: radial-gradient(circle at 30% 26%, #fff, #eceef2); }
    .clock { background: radial-gradient(circle at 35% 25%, #fff, #eceef3); }
    .safari { background: radial-gradient(circle at 30% 26%, #49b4ff, #2f85ea 62%, #1b5db9); }
    .calc { background: radial-gradient(circle at 35% 26%, #5b626f, #383f4b); color: #f5f7fb; }
    .music { background: radial-gradient(circle at 32% 26%, #fff, #eceef3); }
    .play { background: radial-gradient(circle at 30% 26%, #ff2e2e, #dd0707); color: #fff; }
    .settings { background: radial-gradient(circle at 32% 26%, #646b74, #2f333a); color: #edf2f8; }

    .calendar .glyph {
      display: grid;
      text-align: center;
      gap: 0;
      filter: none;
    }

    .calendar .month {
      font-size: clamp(20px, 1.6vw, 32px);
      color: #ff4e3b;
      line-height: 1;
    }

    .calendar .day {
      font-size: clamp(48px, 4.2vw, 62px);
      margin-top: 2px;
      line-height: 0.9;
      color: #2f343d;
      font-weight: 500;
    }

    .clock-face {
      width: 64%;
      aspect-ratio: 1;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 32% 20%, #ffffff, #f0f2f5);
      box-shadow: inset 0 0 0 2px rgba(60, 67, 75, 0.12);
    }

    .clock-hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: bottom center;
      border-radius: 99px;
    }

    .hour { width: 4px; height: 20px; background: #222; transform: translateX(-50%) rotate(305deg); }
    .minute { width: 3px; height: 28px; background: #2f2f2f; transform: translateX(-50%) rotate(62deg); }
    .second { width: 2px; height: 31px; background: #f58900; transform: translateX(-50%) rotate(180deg); }

    .pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.75), rgba(255,255,255,0));
      transform: scale(0.6);
      pointer-events: none;
    }

    .app.launch .pulse {
      animation: pulse 420ms ease;
    }

    @keyframes pulse {
      0% { opacity: 0.9; transform: scale(0.65); }
      100% { opacity: 0; transform: scale(1.35); }
    }

    .message {
      position: absolute;
      left: 50%;
      bottom: 5%;
      transform: translateX(-50%);
      min-width: 220px;
      max-width: min(90vw, 500px);
      text-align: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(33, 39, 46, 0.64);
      color: #f4f7fb;
      font-size: 14px;
      letter-spacing: 0.2px;
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @media (max-width: 900px) {
      .scene { overflow: auto; }
      .room { inset: 4%; min-height: 680px; }
      .apps {
        width: 100%;
        top: 52%;
        grid-template-columns: repeat(3, var(--icon-size));
      }
      .app:nth-child(10) { grid-column: 2; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Interactive app wall">
    <section class="room" aria-hidden="true"></section>
    <div class="sun-shafts" aria-hidden="true"></div>

    <section class="apps" id="apps">
      <button class="app weather" style="--depth:1.3" data-app="Weather">
        <span class="glyph">🌤️</span><span class="pulse"></span><small>Weather</small>
      </button>
      <button class="app chat" style="--depth:1.4" data-app="Messages">
        <span class="glyph">💬</span><span class="pulse"></span><small>Messages</small>
      </button>
      <button class="app calendar" style="--depth:0.9" data-app="Calendar">
        <span class="glyph"><span class="month">Sep</span><span class="day">7</span></span>
        <span class="pulse"></span><small>Calendar</small>
      </button>
      <button class="app photos" style="--depth:1.1" data-app="Photos">
        <span class="glyph">🌈</span><span class="pulse"></span><small>Photos</small>
      </button>
      <button class="app clock" style="--depth:1.2" data-app="Clock">
        <span class="clock-face">
          <span class="clock-hand hour"></span>
          <span class="clock-hand minute"></span>
          <span class="clock-hand second"></span>
        </span>
        <span class="pulse"></span><small>Clock</small>
      </button>
      <button class="app safari" style="--depth:1.5" data-app="Browser">
        <span class="glyph">🧭</span><span class="pulse"></span><small>Browser</small>
      </button>
      <button class="app calc" style="--depth:1.1" data-app="Calculator">
        <span class="glyph">🧮</span><span class="pulse"></span><small>Calculator</small>
      </button>
      <button class="app music" style="--depth:0.8" data-app="Music">
        <span class="glyph">🎵</span><span class="pulse"></span><small>Music</small>
      </button>
      <button class="app play" style="--depth:1.4" data-app="Player">
        <span class="glyph">▶️</span><span class="pulse"></span><small>Player</small>
      </button>
      <button class="app settings" style="--depth:1.3" data-app="Settings">
        <span class="glyph">⚙️</span><span class="pulse"></span><small>Settings</small>
      </button>
    </section>

    <div class="message" id="message" role="status" aria-live="polite"></div>
  </main>

  <script>
    const scene = document.getElementById("scene");
    const message = document.getElementById("message");
    const appButtons = Array.from(document.querySelectorAll(".app"));

    function setParallax(clientX, clientY) {
      const rect = scene.getBoundingClientRect();
      const px = (clientX - rect.left) / rect.width - 0.5;
      const py = (clientY - rect.top) / rect.height - 0.5;

      const tiltY = px * 8;
      const tiltX = py * -7;
      const moveX = px * 24;
      const moveY = py * 18;

      scene.style.setProperty("--tilt-x", `${tiltX}deg`);
      scene.style.setProperty("--tilt-y", `${tiltY}deg`);
      scene.style.setProperty("--move-x", `${moveX}px`);
      scene.style.setProperty("--move-y", `${moveY}px`);
    }

    function resetParallax() {
      scene.style.setProperty("--tilt-x", "0deg");
      scene.style.setProperty("--tilt-y", "0deg");
      scene.style.setProperty("--move-x", "0px");
      scene.style.setProperty("--move-y", "0px");
    }

    function launchApp(button) {
      const appName = button.dataset.app;
      button.classList.remove("launch");
      button.offsetHeight;
      button.classList.add("launch");

      message.textContent = `${appName} opened`;
      message.classList.add("show");
      clearTimeout(launchApp.timer);
      launchApp.timer = setTimeout(() => message.classList.remove("show"), 1100);
    }

    appButtons.forEach((button) => {
      button.addEventListener("click", () => launchApp(button));
      button.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          launchApp(button);
        }
      });
    });

    scene.addEventListener("pointermove", (event) => setParallax(event.clientX, event.clientY));
    scene.addEventListener("pointerleave", resetParallax);
  </script>
</body>
</html>
