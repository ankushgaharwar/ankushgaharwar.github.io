    <style>
      :root { --page-bg: #f7f6f2; --page-text: #111111; --page-muted: #8d8c86; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; background: var(--page-bg); color: var(--page-text); font-family: Arial, Helvetica, sans-serif; }
      .cover-detail { min-height: 100vh; padding: clamp(132px, 13vw, 188px) clamp(20px, 3.35vw, 64px) 136px; }
      .cover-detail__header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin-bottom: 24px; }
      .cover-detail h2 { margin: 0; max-width: 980px; font-size: clamp(42px, 7vw, 104px); line-height: 0.95; font-weight: 400; letter-spacing: 0; }
      .cover-detail__meta { margin: 0 0 0 auto; color: var(--page-muted); font-size: clamp(14px, 1.25vw, 22px); white-space: nowrap; }
      .cover-detail__media { width: 100%; min-height: 55vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .cover-detail__media img { display: block; width: 100%; max-height: min(74vh, 900px); object-fit: contain; border-radius: 8px; }
      @media (max-width: 760px) {
        .cover-detail { padding: 132px 20px 124px; }
        .cover-detail__header { grid-template-columns: 1fr; gap: 10px; }
        .cover-detail__meta { margin-left: 0; }
        .cover-detail__media { min-height: 45vh; }
      }
    </style>
  </head>
